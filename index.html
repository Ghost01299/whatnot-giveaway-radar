<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whatnot Giveaway Radar</title>
<style>
body {
  background: #10111b;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
h1 { color: #a78bfa; }
.card {
  background: #202133;
  padding: 18px;
  border-radius: 14px;
  margin: 15px 0;
}
button {
  background: #8b5cf6;
  color: white;
  border: 0;
  padding: 13px;
  border-radius: 9px;
  width: 100%;
}
</style>
</head>
<body>

<h1>🎁 Giveaway Radar</h1>
<p>Whatnot monitoring dashboard</p>

<div class="card">
  <h3>Statut du scanner</h3>
  <p id="status">En attente</p>
  <button onclick="startScanner()">Démarrer le scanner</button>
</div>

<div class="card">
  <h3>Giveaways détectés</h3>
  <h2 id="count">0</h2>
  <p id="result">Aucune détection pour le moment.</p>
</div>

<script>
function startScanner() {
  document.getElementById("status").textContent =
    "Interface de démonstration activée";

  document.getElementById("result").textContent =
    "En attente d'une source de données autorisée.";
}
</script>

</body>
</html>
